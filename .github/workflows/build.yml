name: Build & Release

on:
  push:
    branches: [ master, 'release/**' ]
    tags: [ 'v*' ]
    paths-ignore: [ 'README.md', 'CHANGELOG.md', 'docs/**', 'marketplace/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release:
        description: Create the release for the version in the VSIX manifest (master only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      VSIX_PATH: LLLMPluginModern\bin\Release\LLLMPluginModern.vsix
      VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build VSIX
        run: msbuild LLLMPluginModern.sln -restore -p:Configuration=Release -p:DeployExtension=false -v:minimal -nologo

      # Markdown, think-tag filtering, text tools, prompts, endpoints and the settings migration. A failure here stops
      # the run before anything is released or published.
      - name: Unit tests
        run: dotnet test tests\LLLMPluginModern.Tests -c Release --nologo

      - name: Inspect VSIX contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:VSIX_PATH))
          try {
            $zip.Entries | ForEach-Object { '{0,10}  {1}' -f $_.Length, $_.FullName }
            $names = $zip.Entries.FullName
            # Newtonsoft.Json is intentionally absent: Visual Studio ships it and the VSSDK excludes it.
            foreach ($required in 'extension.vsixmanifest', 'LLLMPluginModern.dll', 'LLLMPluginModern.pkgdef',
                                  'Resources/Icon.png', 'Resources/Preview.png', 'LICENSE.txt') {
              if ($names -notcontains $required) { throw "The VSIX is missing $required." }
            }
            $pkgdef = $zip.GetEntry('LLLMPluginModern.pkgdef').Open()
            $reader = New-Object IO.StreamReader($pkgdef)
            '--- pkgdef ---'; $reader.ReadToEnd(); $reader.Dispose()
          } finally { $zip.Dispose() }

      - name: Determine the release
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_REQUESTED: ${{ inputs.release }}
        run: |
          [xml]$manifest = Get-Content LLLMPluginModern\source.extension.vsixmanifest
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          $tag = ''
          if ($env:REF_TYPE -eq 'tag') {
            # A pushed v* tag must match the manifest version.
            if ($env:REF_NAME -ne "v$version") { throw "Tag $env:REF_NAME does not match the manifest version $version." }
            $tag = $env:REF_NAME
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:RELEASE_REQUESTED -eq 'true') {
            # A manual run tags the built commit with the manifest version.
            if ($env:REF -ne 'refs/heads/master') { throw 'Releases are created from master only.' }
            $tag = "v$version"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ($tag) { "Release: $tag" } else { 'No release for this run.' }

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: LocalLLMPlugin-vsix
          path: ${{ env.VSIX_PATH }}
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.release.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $asset = "LocalLLMPlugin-$env:TAG.vsix"
          Copy-Item $env:VSIX_PATH $asset
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release already exists (for example, created on github.com): refresh its VSIX.
            gh release upload $env:TAG $asset --clobber
          } else {
            $notes = "docs/release-notes/$env:TAG.md"
            $notesArgs = @('--generate-notes')
            if (Test-Path $notes) { $notesArgs = @('--notes-file', $notes) }
            # --target creates the tag on the built commit when it does not exist yet.
            gh release create $env:TAG $asset --target $env:GITHUB_SHA --title "Local LLM Plugin $env:TAG" @notesArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "gh failed with exit code $LASTEXITCODE." }

      - name: Publish to the Visual Studio Marketplace
        if: steps.release.outputs.tag != '' && env.VS_MARKETPLACE_TOKEN != ''
        shell: pwsh
        run: |
          $publisher = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.vssdk.buildtools" -Recurse -Filter VsixPublisher.exe |
            Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $publisher) { throw 'VsixPublisher.exe was not found in the Microsoft.VSSDK.BuildTools package.' }
          & $publisher.FullName publish `
            -payload $env:VSIX_PATH `
            -publishManifest marketplace\publishManifest.json `
            -personalAccessToken $env:VS_MARKETPLACE_TOKEN `
            -ignoreWarnings "VSIXValidatorWarning01,VSIXValidatorWarning02,VSIXValidatorWarning08"
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher failed with exit code $LASTEXITCODE." }
